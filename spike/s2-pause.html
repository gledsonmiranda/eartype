<!doctype html>
<meta charset="utf-8">
<title>SPIKE S-2 — precisão da pausa</title>
<style>
  body { font: 14px ui-monospace, monospace; background: #111; color: #eee; padding: 24px; }
  #log { white-space: pre; line-height: 1.6; }
  .ok { color: #6ee7a8 } .warn { color: #fbbf24 } .bad { color: #f87171 }
  h2 { font-size: 14px; margin: 18px 0 6px }
</style>

<h2>SPIKE S-2 — quanto a pausa passa do alvo?</h2>
<div id="player"></div>
<div id="log">carregando player…</div>

<script>
// Mede o erro de pausa do loop: seekTo(alvo-2s) → play → polling → pause(alvo).
// Cada trial mede overshoot = tempo real da pausa − alvo.
const VIDEO_ID = new URLSearchParams(location.search).get('v') || 'jNQXAC9IVRw';
const POLL_MS  = Number(new URLSearchParams(location.search).get('poll') || 100);
const LEAD_MS  = Number(new URLSearchParams(location.search).get('lead') || 0);
const TRIALS   = 10;

const log = document.getElementById('log');
const lines = [];
const say = (s, cls = '') => {
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  log.innerHTML = lines.join('\n');
};

let player, results = [];

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    height: 200, width: 356, videoId: VIDEO_ID,
    playerVars: { controls: 0, cc_load_policy: 0, rel: 0, modestbranding: 1 },
    events: { onReady: onReady, onError: (e) => say(`ERRO do player: código ${e.data}`, 'bad') },
  });
};

async function onReady() {
  player.mute(); // autoplay sem gesto do usuário só é permitido mudo
  const dur = player.getDuration();
  say(`vídeo ${VIDEO_ID} · duração ${dur.toFixed(1)}s · polling ${POLL_MS}ms · lead ${LEAD_MS}ms\n`);
  if (!dur || dur < 6) return say('vídeo curto demais para o teste', 'bad');

  for (let i = 0; i < TRIALS; i++) await trial(i, dur);
  report();
}

function trial(i, dur) {
  return new Promise((resolve) => {
    // alvo espalhado pelo vídeo, sempre com 2s de reprodução antes
    const target = 3 + ((i * 1.7) % Math.max(1, dur - 5));
    const start = target - 2;

    player.seekTo(start, true);
    player.playVideo();

    const t0 = performance.now();
    const timer = setInterval(() => {
      const now = player.getCurrentTime();
      if (now >= target - LEAD_MS / 1000) {
        clearInterval(timer);
        player.pauseVideo();
        // lê de novo DEPOIS da pausa: é onde o vídeo realmente parou
        setTimeout(() => {
          const stopped = player.getCurrentTime();
          const overshoot = (stopped - target) * 1000;
          results.push(overshoot);
          const cls = Math.abs(overshoot) < 150 ? 'ok' : Math.abs(overshoot) < 400 ? 'warn' : 'bad';
          say(`trial ${String(i + 1).padStart(2)}  alvo ${target.toFixed(3)}s  parou ${stopped.toFixed(3)}s  ` +
              `overshoot ${overshoot >= 0 ? '+' : ''}${overshoot.toFixed(0)}ms  (${(performance.now() - t0).toFixed(0)}ms)`, cls);
          resolve();
        }, 350);
      }
      if (performance.now() - t0 > 15000) { clearInterval(timer); say(`trial ${i + 1}: timeout`, 'bad'); resolve(); }
    }, POLL_MS);
  });
}

function report() {
  if (!results.length) return say('\nsem resultados', 'bad');
  const abs = results.map(Math.abs).sort((a, b) => a - b);
  const med = abs[Math.floor(abs.length / 2)];
  const max = abs[abs.length - 1];
  const avg = abs.reduce((a, b) => a + b, 0) / abs.length;
  const verdict = med < 150 ? ['VERDE — polling de 100ms serve', 'ok']
                : med < 400 ? ['AMARELO — reduzir poll para 50ms e/ou aumentar o lead', 'warn']
                            : ['VERMELHO — o loop precisa de outra abordagem', 'bad'];
  say(`\nmediana |overshoot| ${med.toFixed(0)}ms · média ${avg.toFixed(0)}ms · pior ${max.toFixed(0)}ms`);
  say(`VEREDITO: ${verdict[0]}`, verdict[1]);
  say('S2_DONE');
}

const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(s);
</script>
